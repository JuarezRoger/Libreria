{% extends 'base.html' %}

{% block title %}Editar Libro - Librería Online{% endblock %}

{% block content %}
<div class="py-5">
    <div class="container">
        <h1 class="section-title mb-4">Editar Libro</h1>
        <form method="POST" class="p-4 bg-white rounded shadow-sm" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" id="titulo" name="titulo" class="form-control" value="{{ libro.titulo }}" required>
            </div>
            <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input type="text" id="autor" name="autor" class="form-control" value="{{ libro.autor }}" required>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" name="descripcion" class="form-control" rows="4" required>{{ libro.descripcion }}</textarea>
            </div>
            <div class="mb-3">
                <label for="isbn" class="form-label">ISBN</label>
                <input type="text" id="isbn" name="isbn" class="form-control" value="{{ libro.isbn }}" required>
            </div>
            <div class="mb-3">
                <label for="fecha_publicacion" class="form-label">Fecha de Publicación</label>
                <input type="date" id="fecha_publicacion" name="fecha_publicacion" class="form-control" value="{{ libro.fecha_publicacion }}" required>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" id="precio" name="precio" class="form-control" value="{{ libro.precio }}" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" id="stock" name="stock" class="form-control" value="{{ libro.stock }}" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" id="en_oferta" name="en_oferta" class="form-check-input"{% if libro.en_oferta %} checked{% endif %}>
                <label for="en_oferta" class="form-check-label">Está en oferta</label>
            </div>
            <div class="mb-3">
                <label for="precio_oferta" class="form-label">Precio de Oferta</label>
                <input type="number" id="precio_oferta" name="precio_oferta" class="form-control" value="{{ libro.precio_oferta }}" step="0.01">
            </div>
            <div class="mb-3">
                <label for="categoria" class="form-label">Categoría</label>
                <select id="categoria" name="categoria" class="form-select" required>
                    <option value="">Seleccione una categoría</option>
                    {% for categoria in categorias %}
                    <option value="{{ categoria.id }}" {% if libro.categoria and libro.categoria.id == categoria.id %}selected{% endif %}>{{ categoria.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="{% url 'libros:admin_panel' %}" class="btn btn-secondary ms-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
