{% extends 'repuestos/base.html' %}
{% block content %}
<a href="{% url 'repuestos:movimientos_create' %}">Nuevo Movimiento</a>
<table>
  <tr><th>Fecha</th><th>Repuesto</th><th>Tipo</th><th>Cantidad</th></tr>
  {% for m in movimientos %}
  <tr>
    <td>{{ m.fecha }}</td>
    <td>{{ m.repuesto.nombre }}</td>
    <td>{{ m.get_tipo_display }}</td>
    <td>{{ m.cantidad }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="4">Sin movimientos.</td></tr>
  {% endfor %}
</table>
{% endblock %}
